<svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#0d1117" rx="12"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">E-Commerce Data Lakehouse — ELT on GCS + BigQuery + Airflow</text>

  <!-- 1: Source -->
  <rect x="20" y="60" width="160" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="100" y="82" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="bold">SYNTHETIC SOURCE</text>
  <text x="100" y="102" text-anchor="middle" font-size="9" fill="#8b949e">scripts/generate_data.py</text>
  <text x="100" y="120" text-anchor="middle" font-size="9" fill="#58a6ff">customers · products</text>
  <text x="100" y="136" text-anchor="middle" font-size="9" fill="#58a6ff">orders · order_items</text>
  <text x="100" y="156" text-anchor="middle" font-size="9" fill="#6e7681">seeded, configurable scale</text>
  <text x="100" y="172" text-anchor="middle" font-size="9" fill="#6e7681">sample: 200 / 50 / 2,000</text>
  <text x="100" y="196" text-anchor="middle" font-size="9" fill="#6e7681">make upload</text>

  <line x1="180" y1="135" x2="200" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2: GCS -->
  <rect x="202" y="60" width="160" height="150" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="282" y="82" text-anchor="middle" font-size="10" fill="#e3b341" font-weight="bold">GCS LANDING</text>
  <text x="282" y="104" text-anchor="middle" font-size="9" fill="#8b949e">landing/customers/</text>
  <text x="282" y="120" text-anchor="middle" font-size="9" fill="#8b949e">landing/products/</text>
  <text x="282" y="136" text-anchor="middle" font-size="9" fill="#8b949e">landing/orders/</text>
  <text x="282" y="152" text-anchor="middle" font-size="9" fill="#8b949e">landing/order_items/</text>
  <text x="282" y="180" text-anchor="middle" font-size="9" fill="#6e7681">GCSToBigQueryOperator</text>
  <text x="282" y="196" text-anchor="middle" font-size="9" fill="#6e7681">WRITE_TRUNCATE daily</text>

  <line x1="362" y1="135" x2="382" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3: BQ Raw -->
  <rect x="384" y="60" width="160" height="150" rx="8" fill="#161b22" stroke="#ff7b72"/>
  <text x="464" y="82" text-anchor="middle" font-size="10" fill="#ff7b72" font-weight="bold">BIGQUERY RAW</text>
  <text x="464" y="104" text-anchor="middle" font-size="9" fill="#8b949e">ecommerce_raw.customers</text>
  <text x="464" y="120" text-anchor="middle" font-size="9" fill="#8b949e">ecommerce_raw.products</text>
  <text x="464" y="136" text-anchor="middle" font-size="9" fill="#8b949e">ecommerce_raw.orders</text>
  <text x="464" y="152" text-anchor="middle" font-size="9" fill="#8b949e">ecommerce_raw.order_items</text>
  <text x="464" y="180" text-anchor="middle" font-size="9" fill="#6e7681">orders partitioned</text>
  <text x="464" y="196" text-anchor="middle" font-size="9" fill="#6e7681">by order_date</text>

  <line x1="544" y1="135" x2="564" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4: Checks -->
  <rect x="566" y="60" width="160" height="150" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="646" y="82" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="bold">QUALITY CHECKS</text>
  <text x="646" y="104" text-anchor="middle" font-size="9" fill="#8b949e">BigQueryCheckOperator</text>
  <text x="646" y="124" text-anchor="middle" font-size="9" fill="#8b949e">orders loaded</text>
  <text x="646" y="140" text-anchor="middle" font-size="9" fill="#8b949e">order → customer exists</text>
  <text x="646" y="156" text-anchor="middle" font-size="9" fill="#8b949e">line item → order exists</text>
  <text x="646" y="172" text-anchor="middle" font-size="9" fill="#8b949e">order total = sum of lines</text>
  <text x="646" y="196" text-anchor="middle" font-size="9" fill="#6e7681">fail → analytics skipped</text>

  <line x1="726" y1="135" x2="746" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5: Analytics -->
  <rect x="748" y="60" width="152" height="150" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="824" y="82" text-anchor="middle" font-size="10" fill="#bc8cff" font-weight="bold">ANALYTICS TABLES</text>
  <text x="824" y="102" text-anchor="middle" font-size="9" fill="#8b949e">ecommerce_analytics.*</text>
  <text x="824" y="120" text-anchor="middle" font-size="9" fill="#58a6ff">rfm_segmentation</text>
  <text x="824" y="136" text-anchor="middle" font-size="9" fill="#58a6ff">revenue_trends</text>
  <text x="824" y="152" text-anchor="middle" font-size="9" fill="#58a6ff">revenue_by_channel</text>
  <text x="824" y="168" text-anchor="middle" font-size="9" fill="#58a6ff">product_performance</text>
  <text x="824" y="184" text-anchor="middle" font-size="9" fill="#58a6ff">customer_cohort_retention</text>
  <text x="824" y="200" text-anchor="middle" font-size="9" fill="#6e7681">CTAS per SQL file</text>

  <!-- Airflow -->
  <rect x="20" y="236" width="880" height="78" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="460" y="258" text-anchor="middle" font-size="11" fill="#58a6ff" font-weight="bold">Apache Airflow — ecommerce_elt_pipeline DAG (daily 05:00 UTC)</text>
  <text x="460" y="280" text-anchor="middle" font-size="9.5" fill="#e6edf3">start &gt;&gt; load_* (4 tables) &gt;&gt; check_* (4 checks) &gt;&gt; build_* (5 analytics tables) &gt;&gt; end</text>
  <text x="460" y="300" text-anchor="middle" font-size="9" fill="#6e7681">GCSToBigQueryOperator · BigQueryCheckOperator · BigQueryInsertJobOperator · retries=2 · email_on_failure</text>

  <!-- SQL techniques -->
  <rect x="20" y="330" width="880" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="460" y="352" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="bold">SQL techniques</text>
  <text x="460" y="372" text-anchor="middle" font-size="9" fill="#8b949e">NTILE (RFM scores) · LAG (MoM / YoY) · SUM() OVER () (channel share) · RANK (overall + per category) · cohort retention matrix</text>

  <text x="460" y="408" text-anchor="middle" font-size="9" fill="#6e7681">Stack: Python 3.11 | Apache Airflow 2.8 | Google Cloud Storage | BigQuery | pytest</text>
</svg>
